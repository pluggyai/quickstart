<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pluggy Quickstart Example</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <main class="main"></main>
    <script src="https://cdn.pluggy.ai/pluggy-connect/v2.8.2/pluggy-connect.js"></script>
    <script>
      // This page runs inside YOUR app, for a user who is already signed in.
      //
      // CONNECT_TOKEN_URL is your backend endpoint that creates a Connect Token
      // for that user (it sets clientUserId from the session, never from this page).
      // Reference: https://github.com/pluggyai/quickstart/tree/master/examples/vercel-node-connect-token
      //
      // getUserAuthHeader() must return how your app authenticates the signed-in
      // user to your backend. Leave it empty if your backend uses a session cookie
      // on the same origin. Never put your Pluggy CLIENT_ID / CLIENT_SECRET here.
      const CONNECT_TOKEN_URL = '<your connect token endpoint>'

      function getUserAuthHeader() {
        // e.g. return { Authorization: `Bearer ${yourAuthClient.getAccessToken()}` }
        return {}
      }

      fetch(CONNECT_TOKEN_URL, {
        method: 'POST',
        credentials: 'same-origin',
        headers: {
          Accept: 'application/json',
          'Content-Type': 'application/json',
          ...getUserAuthHeader(),
        },
        // To update an existing Item of this user, send { itemId: '<item id>' }.
        body: JSON.stringify({}),
      })
        .then((response) => {
          if (!response.ok) throw new Error(`Connect Token request failed: ${response.status}`)
          return response.json()
        })
        .then(({ accessToken }) => {
          const pluggyConnect = new PluggyConnect({
            connectToken: accessToken,
            includeSandbox: true, // sandbox connectors for testing; remove in production
            onSuccess: (itemData) => {
              // The Item now belongs to the signed-in user. Store item.id on your
              // backend (or rely on webhooks) and fetch its data server-side.
              console.log('Pluggy Connect success', itemData.item.id)
            },
            onError: (error) => {
              console.error('Pluggy Connect error', error.message)
            },
          })
          pluggyConnect.init()
        })
        .catch((error) => console.error(error.message))
    </script>
  </body>
</html>
